name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # NuGet.config points at the vendored packages/ folder only, so this proves the
      # offline restore still works.
      - name: Restore
        run: dotnet restore Packman.sln

      - name: Build
        run: dotnet build Packman.sln --no-restore -c Release

      - name: Test
        run: dotnet test Packman.Tests/Packman.Tests.csproj --no-build -c Release --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Packman.Tests/TestResults/*.trx
